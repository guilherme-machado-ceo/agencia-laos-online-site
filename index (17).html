    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where

    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

      el.src = u + frag;

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }

        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

          const blob = new Blob([finalBytes], { type: entry.mime });

          resourceBlobs[blobUrls[uuid]] = blob;

        console.error('Failed to decode asset ' + uuid + ':', err);

      }

    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}.cursor-brackets{display:none!important}#shaderBg{display:none!important}}\\n    <\u002Fstyle>\\n\\n<\u002Fhead>\\n<body>\\n\\n<nav class=\\\"nav\\\" id=\\\"nav\\\">\\n    <img src=\\\"199622af-7e1c-492b-b625-8dcfe2035f61\\\" alt=\\\"LAOS\\\" class=\\\"nav__brand-img\\\" onclick=\\\"goTo('home')\\\">\\n    <div class=\\\"nav__left\\\">\\n    <ul class=\\\"nav__links\\\">\\n        <li><a href=\\\"#\\\" onclick=\\\"goTo('trabalhos');return false\\\">Projetos<\u002Fa><\u002Fli>\\n        <li class=\\\"nav__item--dropdown\\\"><button aria-expanded=\\\"false\\\" aria-haspopup=\\\"true\\\">Serviços<\u002Fbutton><ul class=\\\"nav__submenu\\\"><li><a href=\\\"#\\\" onclick=\\\"goTo('marca');return false\\\">Marca e Posicionamento<\u002Fa><\u002Fli><li><a href=\\\"#\\\" onclick=\\\"goTo('creators');return false\\\">Creators e UGC<\u002Fa><\u002Fli><li><a href=\\\"#\\\" onclick=\\\"goTo('sistemas');return false\\\">IA e Sistemas Criativos<\u002Fa><\u002Fli><li><a href=\\\"#\\\" onclick=\\\"goTo('direcao');return false\\\">Direção Criativa<\u002Fa><\u002Fli><\u002Ful><\u002Fli>\\n        <li><a href=\\\"#\\\" onclick=\\\"goTo('metodo');return false\\\">Método<\u002Fa><\u002Fli>\\n        <li><a href=\\\"#\\\" onclick=\\\"goTo('manifesto');return false\\\">Manifesto<\u002Fa><\u002Fli>\\n        <li><a href=\\\"#\\\" onclick=\\\"goTo('home','contato');return false\\\">Contato<\u002Fa><\u002Fli>\\n    <\u002Ful>\\n    <a href=\\\"https://calendly.com/agencialaos\\\" class=\\\"btn btn--primary btn--nav nav__cta\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Falar com a Laos<\u002Fa>\\n    <\u002Fdiv>\\n    <button class=\\\"nav__hamburger\\\" id=\\\"navToggle\\\" aria-label=\\\"Abrir menu\\\" aria-expanded=\\\"false\\\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fbutton>\\n<\u002Fnav>\\n\\n<div class=\\\"mobile-menu\\\" id=\\\"mobileMenu\\\" aria-hidden=\\\"true\\\">\\n    <ul class=\\\"mobile-menu__list\\\">\\n        <li><a href=\\\"#\\\" onclick=\\\"goTo('trabalhos');closeMobile();return false\\\">Projetos<\u002Fa><\u002Fli>\\n        <li class=\\\"mobile-menu__item--dropdown\\\"><button class=\\\"mobile-menu__toggle\\\" onclick=\\\"toggleMobileSub(this)\\\" aria-expanded=\\\"false\\\">Serviços<\u002Fbutton>\\n            <ul class=\\\"mobile-menu__submenu\\\">\\n                <li><a href=\\\"#\\\" onclick=\\\"goTo('marca');closeMobile();return false\\\">Marca e Posicionamento<\u002Fa><\u002Fli>\\n                <li><a href=\\\"#\\\" onclick=\\\"goTo('creators');closeMobile();return false\\\">Creators e UGC<\u002Fa><\u002Fli>\\n                <li><a href=\\\"#\\\" onclick=\\\"goTo('sistemas');closeMobile();return false\\\">IA e Sistemas Criativos<\u002Fa><\u002Fli>\\n                <li><a href=\\\"#\\\" onclick=\\\"goTo('direcao');closeMobile();return false\\\">Direção Criativa<\u002Fa><\u002Fli>\\n            <\u002Ful>\\n        <\u002Fli>\\n        <li><a href=\\\"#\\\" onclick=\\\"goTo('metodo');closeMobile();return false\\\">Método<\u002Fa><\u002Fli>\\n        <li><a href=\\\"#\\\" onclick=\\\"goTo('manifesto');closeMobile();return false\\\">Manifesto<\u002Fa><\u002Fli>\\n        <li><a href=\\\"#\\\" onclick=\\\"goTo('home','contato');closeMobile();return false\\\">Contato<\u002Fa><\u002Fli>\\n    <\u002Ful>\\n    <a href=\\\"https://calendly.com/agencialaos\\\" class=\\\"btn btn--primary mobile-menu__cta\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Falar com a Laos<\u002Fa>\\n<\u002Fdiv>\\n\\n<!-- HOME --><div class=\\\"page active\\\" id=\\\"page-home\\\">\\n    <section class=\\\"hero\\\" id=\\\"hero\\\"><canvas id=\\\"shaderBg\\\"><\u002Fcanvas><div class=\\\"hero__inner\\\">\\n        <span class=\\\"label hero__label\\\">AGÊNCIA CRIATIVA PARA EMPRESAS DE TECNOLOGIA<\u002Fspan>\\n        <h1 class=\\\"hero__title\\\" data-words=\\\"\\\">Difícil não é construir a tecnologia. É fazer alguém querer usá-la.<\u002Fh1>\\n        <div class=\\\"hero__divider\\\"><\u002Fdiv>\\n        <p class=\\\"hero__desc\\\">A Laos trabalha a camada humana dos produtos técnicos: marca, narrativa, conteúdo e experiência — para empresas de software, hardware e infraestrutura.<\u002Fp>\\n        <div class=\\\"hero__actions btn-group\\\"><a href=\\\"#\\\" class=\\\"btn btn--primary\\\" onclick=\\\"goTo('trabalhos');return false\\\">Ver os projetos<\u002Fa><a href=\\\"https://calendly.com/agencialaos\\\" class=\\\"btn btn--outline\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Falar com a Laos<\u002Fa><\u002Fdiv>\\n    <\u002Fdiv><\u002Fsection>\\n\\n    <section class=\\\"section section--ivory problema\\\"><div class=\\\"container\\\"><div class=\\\"problema__text text-block--center drift-right\\\">\\n        <h2 class=\\\"h2\\\" data-words=\\\"\\\">Todo produto técnico morre na tradução.<\u002Fh2>\\n        <p>A engenharia resolve o problema difícil. Depois o produto precisa atravessar uma distância que nenhum time técnico foi treinado para atravessar: a distância entre o que ele faz e o que alguém entende que ele faz.<\u002Fp>\\n        <p>Essa distância tem preço, e o preço aparece em lugares que ninguém atribui à comunicação. O ciclo de venda se alonga porque o comprador não consegue explicar o produto internamente. O custo de aquisição sobe porque o anúncio descreve funcionalidade em vez de consequência. O onboarding trava. O churn começa antes do primeiro uso.<\u002Fp>\\n        <p>Não é um problema de mídia. Não se resolve com mais volume de conteúdo. É um problema de tradução — e tradução é ofício, não ferramenta.<\u002Fp>\\n    <\u002Fdiv><\u002Fdiv><\u002Fsection>\\n\\n    <section class=\\\"section section--graphite accordion-section\\\"><div class=\\\"container\\\">\\n        <div class=\\\"section-header reveal\\\"><span class=\\\"label\\\">POR QUE O MARKETING TÉCNICO NÃO CONVERTE<\u002Fspan><h2 class=\\\"h2\\\" data-words=\\\"\\\">Três razões. Uma causa.<\u002Fh2><\u002Fdiv>\\n        <div class=\\\"accordion-list\\\">\\n            <div class=\\\"accordion reveal\\\"><button class=\\\"accordion__trigger\\\" aria-expanded=\\\"false\\\"><span class=\\\"accordion__number\\\">01<\u002Fspan><div class=\\\"accordion__header\\\"><h3 class=\\\"accordion__title\\\">Quem assina o contrato quase nunca é quem vai usar o produto<\u002Fh3><p class=\\\"accordion__conclusion\\\">A decisão passa por finanças, jurídico e diretoria. Nenhum deles lê especificação.<\u002Fp><\u002Fdiv><span class=\\\"accordion__icon\\\" aria-hidden=\\\"true\\\"><span class=\\\"accordion__plus\\\">+<\u002Fspan><span class=\\\"accordion__minus\\\">−<\u002Fspan><\u002Fspan><\u002Fbutton><div class=\\\"accordion__body\\\"><div class=\\\"accordion__body-inner\\\"><p>Em venda B2B a decisão raramente é de uma pessoa só. O time técnico avalia, mas quem aprova o orçamento avalia risco, prazo e narrativa interna.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\\n            <div class=\\\"accordion reveal\\\"><button class=\\\"accordion__trigger\\\" aria-expanded=\\\"false\\\"><span class=\\\"accordion__number\\\">02<\u002Fspan><div class=\\\"accordion__header\\\"><h3 class=\\\"accordion__title\\\">Especificação não constrói preferência<\u002Fh3><p class=\\\"accordion__conclusion\\\">Lista de funcionalidades é comparável. Marca não é.<\u002Fp><\u002Fdiv><span class=\\\"accordion__icon\\\" aria-hidden=\\\"true\\\"><span class=\\\"accordion__plus\\\">+<\u002Fspan><span class=\\\"accordion__minus\\\">−<\u002Fspan><\u002Fspan><\u002Fbutton><div class=\\\"accordion__body\\\"><div class=\\\"accordion__body-inner\\\"><p>A única saída de uma disputa por preço é a diferenciação simbólica: o que a empresa representa, como ela fala, que tipo de decisão ela torna possível para quem compra.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\\n            <div class=\\\"accordion reveal\\\"><button class=\\\"accordion__trigger\\\" aria-expanded=\\\"false\\\"><span class=\\\"accordion__number\\\">03<\u002Fspan><div class=\\\"accordion__header\\\"><h3 class=\\\"accordion__title\\\">Adoção é comunicação, não produto<\u002Fh3><p class=\\\"accordion__conclusion\\\">O usuário que não entende para que serve não abandona por insatisfação. Abandona por ausência de sentido.<\u002Fp><\u002Fdiv><span class=\\\"accordion__icon\\\" aria-hidden=\\\"true\\\"><span class=\\\"accordion__plus\\\">+<\u002Fspan><span class=\\\"accordion__minus\\\">−<\u002Fspan><\u002Fspan><\u002Fbutton><div class=\\\"accordion__body\\\"><div class=\\\"accordion__body-inner\\\"><p>Boa parte do que os times classificam como problema de produto é problema de expectativa mal construída antes da compra.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\\n        <\u002Fdiv>\\n    <\u002Fdiv><\u002Fsection>\\n\\n    <section class=\\\"section section--marsala statement\\\"><div class=\\\"statement__inner\\\"><p class=\\\"statement__text\\\" data-words=\\\"\\\">A camada que falta entre a sua tecnologia e o seu mercado não é técnica. É humana. É exatamente ali que a Laos trabalha.<\u002Fp><\u002Fdiv><\u002Fsection>\\n\\n    <section class=\\\"section section--ivory\\\"><div class=\\\"container\\\">\\n        <div class=\\\"section-header reveal\\\"><span class=\\\"label\\\">TRABALHOS<\u002Fspan><h2 class=\\\"h2\\\" data-words=\\\"\\\">O que já está pronto para ser visto.<\u002Fh2><\u002Fdiv>\\n        <div class=\\\"cta-band reveal\\\" style=\\\"background:var(--marsala);border-radius:var(--radius-md);margin-top:32px\\\"><p class=\\\"lead\\\" style=\\\"color:rgba(246,244,239,.75);margin-bottom:28px\\\">O portfólio completo fica fora daqui. Peças, processo e desdobramentos de cada projeto, atualizados continuamente.<\u002Fp><a href=\\\"https://github.com/agencialaos/laosportfolio.github.io\\\" class=\\\"btn btn--primary\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Abrir o portfólio —<\u002Fa><\u002Fdiv>\\n    <\u002Fdiv><\u002Fsection>\\n\\n    <section class=\\\"section section--graphite\\\"><div class=\\\"container\\\">\\n        <div class=\\\"section-header reveal\\\"><span class=\\\"label\\\">O QUE FAZEMOS<\u002Fspan><h2 class=\\\"h2\\\" data-words=\\\"\\\">Quatro frentes. Uma lógica por baixo de todas.<\u002Fh2><\u002Fdiv>\\n        <div class=\\\"service-grid\\\">\\n            <div class=\\\"card card--dark reveal\\\"><span class=\\\"label card__label\\\" style=\\\"color:var(--butter)\\\">MARCA E POSICIONAMENTO<\u002Fspan><h3 class=\\\"h3 card__title\\\">Posicionamento, narrativa, identidade verbal e arquitetura de marca.<\u002Fh3><a href=\\\"#\\\" class=\\\"card__arrow\\\" onclick=\\\"goTo('marca');return false\\\">Saiba mais →<\u002Fa><\u002Fdiv>\\n            <div class=\\\"card card--dark reveal\\\"><span class=\\\"label card__label\\\" style=\\\"color:var(--butter)\\\">CREATORS E UGC<\u002Fspan><h3 class=\\\"h3 card__title\\\">UGC — conteúdo em linguagem de pessoa real para produto técnico.<\u002Fh3><a href=\\\"#\\\" class=\\\"card__arrow\\\" onclick=\\\"goTo('creators');return false\\\">Saiba mais →<\u002Fa><\u002Fdiv>\\n            <div class=\\\"card card--dark reveal\\\"><span class=\\\"label card__label\\\" style=\\\"color:var(--butter)\\\">IA E SISTEMAS CRIATIVOS<\u002Fspan><h3 class=\\\"h3 card__title\\\">IA no processo, critério humano na decisão.<\u002Fh3><a href=\\\"#\\\" class=\\\"card__arrow\\\" onclick=\\\"goTo('sistemas');return false\\\">Saiba mais →<\u002Fa><\u002Fdiv>\\n            <div class=\\\"card card--dark reveal\\\"><span class=\\\"label card__label\\\" style=\\\"color:var(--butter)\\\">DIREÇÃO CRIATIVA<\u002Fspan><h3 class=\\\"h3 card__title\\\">Direção estética, campanha e leitura de comportamento digital.<\u002Fh3><a href=\\\"#\\\" class=\\\"card__arrow\\\" onclick=\\\"goTo('direcao');return false\\\">Saiba mais →<\u002Fa><\u002Fdiv>\\n        <\u002Fdiv>\\n        <p class=\\\"reveal\\\" style=\\\"margin-top:48px;color:var(--concrete);font-size:var(--label);font-weight:var(--fw-bold);text-transform:uppercase;letter-spacing:var(--ls-label)\\\">Como trabalhamos: <a href=\\\"#\\\" style=\\\"color:var(--butter);text-decoration:none;margin-left:8px\\\" onclick=\\\"goTo('metodo');return false\\\">Laos Human Interface →<\u002Fa><\u002Fp>\\n    <\u002Fdiv><\u002Fsection>\\n\\n    <section class=\\\"section section--ivory\\\"><div class=\\\"container\\\">\\n        <div class=\\\"section-header reveal\\\"><span class=\\\"label\\\">O MÉTODO<\u002Fspan><h2 class=\\\"h2\\\" data-words=\\\"\\\">Um percurso em três tempos.<\u002Fh2><p>Cada tempo entrega valor sozinho e habilita o seguinte.<\u002Fp><\u002Fdiv>\\n        <div class=\\\"method-cards\\\">\\n            <div class=\\\"method-card reveal\\\"><div class=\\\"method-card__number\\\">01<\u002Fdiv><h3 class=\\\"method-card__title\\\">Diagnóstico<\u002Fh3><p class=\\\"method-card__text\\\">Escuta profunda do negócio e leitura do território cultural.<\u002Fp><\u002Fdiv>\\n            <div class=\\\"method-card reveal\\\"><div class=\\\"method-card__number\\\">02<\u002Fdiv><h3 class=\\\"method-card__title\\\">Sistema<\u002Fh3><p class=\\\"method-card__text\\\">Posicionamento, narrativa e sistema de marca como estrutura reutilizável.<\u002Fp><\u002Fdiv>\\n            <div class=\\\"method-card reveal\\\"><div class=\\\"method-card__number\\\">03<\u002Fdiv><h3 class=\\\"method-card__title\\\">Operação<\u002Fh3><p class=\\\"method-card__text\\\">Produção, conteúdo, campanha e continuidade.<\u002Fp><\u002Fdiv>\\n        <\u002Fdiv>\\n        <div class=\\\"text-center reveal\\\" style=\\\"margin-top:64px\\\"><a href=\\\"#\\\" class=\\\"btn btn--dark\\\" onclick=\\\"goTo('metodo');return false\\\">Conhecer o método completo —<\u002Fa><\u002Fdiv>\\n    <\u002Fdiv><\u002Fsection>\\n\\n    <section class=\\\"section section--marsala\\\"><div class=\\\"container\\\"><div class=\\\"about-grid\\\">\\n        <div class=\\\"reveal\\\"><h2 class=\\\"h2\\\">Laos<\u002Fh2><\u002Fdiv>\\n        <div class=\\\"about-grid__text drift-right\\\">\\n            <p>Laos vem do grego: povo. A tecnologia que interessa é a que chega às pessoas comuns.<\u002Fp>\\n            <p>Somos uma estrutura enxuta e sênior. Trabalhamos com poucos clientes por vez.<\u002Fp>\\n            <p>Automatizamos o mecânico e preservamos o humano onde o humano decide.<\u002Fp>\\n            <a href=\\\"#\\\" class=\\\"about-grid__link\\\" onclick=\\\"goTo('manifesto');return false\\\">Nossa posição sobre tecnologia —<\u002Fa>\\n        <\u002Fdiv>\\n    <\u002Fdiv><\u002Fdiv><\u002Fsection>\\n\\n    <section class=\\\"section section--graphite manifesto-call\\\"><div class=\\\"manifesto-call__grain\\\" data-parallax=\\\"\\\"><\u002Fdiv><div class=\\\"manifesto-call__inner\\\">\\n        <p class=\\\"manifesto-call__text\\\" data-words=\\\"\\\">A tecnologia deveria aproximar as pessoas da vida, não afastá-las dela.<\u002Fp>\\n        <div class=\\\"reveal\\\" style=\\\"margin-top:48px\\\"><a href=\\\"#\\\" class=\\\"btn btn--outline\\\" onclick=\\\"goTo('manifesto');return false\\\">Ler o manifesto —<\u002Fa><\u002Fdiv>\\n    <\u002Fdiv><\u002Fsection>\\n\\n    <section class=\\\"section section--ivory\\\" id=\\\"contato\\\"><div class=\\\"container\\\"><div class=\\\"contact-grid\\\">\\n        <div class=\\\"contact__text reveal\\\"><h2 class=\\\"h2\\\">Comece por uma conversa de 30 minutos.<\u002Fh2><p>Sem apresentação institucional e sem proposta genérica.<\u002Fp>\\n            <div class=\\\"btn-group\\\" style=\\\"margin-top:32px\\\"><a href=\\\"https://calendly.com/agencialaos\\\" class=\\\"btn btn--dark\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Agendar no calendário<\u002Fa><a href=\\\"https://wa.me/5511985315200?text=Ola%20vim%20do%20site\\\" class=\\\"btn btn--ghost\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Falar no WhatsApp<\u002Fa><\u002Fdiv>\\n        <\u002Fdiv>\\n        <div class=\\\"drift-right\\\"><div class=\\\"contact__info\\\"><a href=\\\"mailto:agencialaos@gmail.com\\\">agencialaos@gmail.com<\u002Fa><a href=\\\"tel:+5511985315200\\\">(11) 98531-5200<\u002Fa><\u002Fdiv><div class=\\\"contact__social\\\"><a href=\\\"https://www.instagram.com/laosagencia/\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Instagram<\u002Fa><a href=\\\"https://www.linkedin.com/company/ag%C3%AAncialaos/\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">LinkedIn<\u002Fa><a href=\\\"https://www.tiktok.com/@laosagencia\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">TikTok<\u002Fa><a href=\\\"https://github.com/agencialaos/laosportfolio.github.io\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\">Portfólio<\u002Fa><\u002Fdiv><\u002Fdiv>\\n    <\u002Fdiv><\u002Fdiv><\u002Fsection>\\n<\u002Fdiv>\\n\\n<!-- TRABALHOS --><div class=\\\"page\\\" id=\\\"page-trabalhos\\\"><section class=\\\"section section--graphite page-banner\\\"><div class=\\\"container\\\"><span class=\\\"label reveal\\\">PROJETOS<\u002Fspan><h1 class=\\\"h1 reveal\\\">O que já está pronto para ser visto.<\u002Fh1><p class=\\\"lead reveal\\\">Seleção de projetos, com a natureza de cada um declarada.<\u002Fp><div class=\\\"reveal\\\" style=\\\"background:rgba(248,222,126,.1);border:1px solid rgba(248,222,126,.35);border-radius:12px;padding:20px 24px;margin-top:40px;max-width:720px;text-align:center\\\"><p style=\\\"color:var(--butter);font-weight:var(--fw-bold);font-size:14px;letter-spacing:.02em\\\">Página em manutenção — novos trabalhos sendo adicionados. Volte em breve.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fsection><section class=\\\"section section--ivory\\\"><div class=\\\"container\\\"><div class=\\\"text-block--center drift-right\\\"><h2 class=\\\"h2\\\" style=\\\"margin-bottom:32px\\\">Como um projeto costuma ser<\u002Fh2><p style=\\\"color:var(--text-muted-light)\\\">Não trabalhamos por pacote fechado de entregáveis.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fsection><section class=\\\"section section--marsala cta-band\\\"><div class=\\\"container text-center\\\"><p class=\\\"lead reveal\\\" style=\\\"color:rgba(246,244,239,.75);margin-bottom:28px\\\">O portfólio completo, com processo e desdobramentos.<\u002Fp><div class=\\\"reveal\\\"><a href=\\\"https://github.com/a
